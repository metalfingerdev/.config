# Font, my favorite font is maple mono :)
font_family Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto

# Make the cursor shape a beam
shell_integration no-cursor
cursor_shape beam

# Padding
window_padding_width 7
window_padding_height 10

# Scrollbar
scrollbar scrolled-and-hovered
scrollbar_interactive yes
scrollback_lines 3000

#Default font size.
font_size 11

# Just a keybind to change font size to your liking, it's CTRL + scroll wheel up or down.
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Background opacity, set to 0 if you want blur/transparency.
# Blur works with hyprland, or sway-fx as a drop-in replacement for sway.
background_opacity 0.80

# Misc
enable_audio_bell no
confirm_os_window_close 0
input_delay 2
repaint_delay 8
cursor_trail 0

# Performance
sync_to_monitor no

# Finally, the COLORS! these use the design system I made for this rice.
cursor               #AC82E9

selection_background #d8cab8
selection_foreground #141216

background           #141216
foreground           #d8cab8

color0               #2b2135
color8               #92fcfa
color1               #fc4649
color9               #fc4649
color2               #c4e881
