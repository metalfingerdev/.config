# ============================================================
# KEYBINDS — ~/.config/hypr/conf/keybinds.conf
# ============================================================

# Super key
$⊞ = SUPER

# Scripts
$toggleFocus = ~/.config/hypr/scripts/smart_focus.sh

# Nicknames
$terminal = kitty
$explorer = GTK_THEME=diinki-retro-dark nautilus
$appLauncher = pgrep wofi > /dev/null 2>&1 && killall wofi || wofi --show drun
$spotify = kitty -- spotify_player
$refresh = hyprctl reload && killall waybar; waybar > /dev/null 2>&1 & notify-send "Reloaded" "Hyprland + Waybar restarted"

# ── Applications ─────────────────────────────────────────────
bind = $⊞,       Return, exec, $terminal
bind = $⊞,       E,      exec, $explorer
bind = $⊞,       D,      exec, $appLauncher
bind = $⊞,       M,      exec, $spotify

# ── System ───────────────────────────────────────────────────
bind = $⊞,       Q,      killactive
bind = $⊞ SHIFT, Q,      exec, hyprctl kill
bind = $⊞ SHIFT, S,      exec, hyprshot --mode region --output-folder /tmp
bind = $⊞ SHIFT, C,      exec, $refresh

# ── Window Management ────────────────────────────────────────
bind = $⊞,       F,      fullscreen
bind = $⊞ SHIFT, SPACE,  togglefloating
bind = $⊞, SPACE, exec,  $toggleFocus

# ── Focus Navigation ─────────────────────────────────────────
bind = $⊞, left,  movefocus, l
bind = $⊞, right, movefocus, r
bind = $⊞, up,    movefocus, u
bind = $⊞, down,  movefocus, d

# ── Move Floating Window ───────────────────────
binde = $⊞ CTRL,       left,  moveactive, -100    0
binde = $⊞ CTRL,       right, moveactive,  100    0
binde = $⊞ CTRL,       up,    moveactive,    0 -100
binde = $⊞ CTRL,       down,  moveactive,    0  100
binde = $⊞ CTRL SHIFT, left,  moveactive,  -10    0
binde = $⊞ CTRL SHIFT, right, moveactive,   10    0
binde = $⊞ CTRL SHIFT, up,    moveactive,    0  -10
binde = $⊞ CTRL SHIFT, down,  moveactive,    0   10

# ── Move Window across Workspace ─────────────────────────────
bind = $⊞ SHIFT, left,  movewindow, l
bind = $⊞ SHIFT, right, movewindow, r
bind = $⊞ SHIFT, up,    movewindow, u
bind = $⊞ SHIFT, down,  movewindow, d

# ── Resize ───────────────────────────────────────────────────
binde = $⊞ ALT,       right, resizeactive,  100    0
binde = $⊞ ALT,       left,  resizeactive, -100    0
binde = $⊞ ALT,       up,    resizeactive,    0 -100
binde = $⊞ ALT,       down,  resizeactive,    0  100
binde = $⊞ ALT SHIFT, right, resizeactive,   10    0
binde = $⊞ ALT SHIFT, left,  resizeactive,  -10    0
binde = $⊞ ALT SHIFT, up,    resizeactive,    0  -10
binde = $⊞ ALT SHIFT, down,  resizeactive,    0   10

# ── Workspaces ───────────────────────────────────────────────
bind = $⊞, 1, workspace, 1
bind = $⊞, 2, workspace, 2
bind = $⊞, 3, workspace, 3
bind = $⊞, 4, workspace, 4
bind = $⊞, 5, workspace, 5
bind = $⊞, 6, workspace, 6
bind = $⊞, 7, workspace, 7
bind = $⊞, 8, workspace, 8
bind = $⊞, 9, workspace, 9
bind = $⊞, 0, workspace, 10

bind = $⊞ SHIFT, 1, movetoworkspace, 1
bind = $⊞ SHIFT, 2, movetoworkspace, 2
bind = $⊞ SHIFT, 3, movetoworkspace, 3
bind = $⊞ SHIFT, 4, movetoworkspace, 4
bind = $⊞ SHIFT, 5, movetoworkspace, 5
bind = $⊞ SHIFT, 6, movetoworkspace, 6
bind = $⊞ SHIFT, 7, movetoworkspace, 7
bind = $⊞ SHIFT, 8, movetoworkspace, 8
bind = $⊞ SHIFT, 9, movetoworkspace, 9
bind = $⊞ SHIFT, 0, movetoworkspace, 10

# ── Mouse ─────────────────────────────────────────────────────
bindm = $⊞, mouse:272, movewindow
bindm = $⊞, mouse:273, resizewindow
bind  = $⊞, mouse_down, workspace, e-1
bind  = $⊞, mouse_up,   workspace, e+1

# ── Media / Hardware Keys ─────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-