# ============================================================
# KEYBINDS — ~/.config/hypr/conf/keybinds.conf
# ============================================================

# Super key
$⊞ = SUPER

# Refresh
$refresh = hyprctl dispatch reload config && notify-send -t 3000 "Hyprland" "Config Reloaded"

# Scripts
$toggleFocus = ~/.config/hypr/scripts/smart_focus.sh

# Default programs, these are what I prefer.
$terminal = kitty
$fileManager = nemo

# TODO:
# This command calls the quickshell IPC to open the app launcher for the currently focused window.
# I know it's a bit messy, I might make this cleaner eventually with a build-in quickshell functionality.
$appLauncher = quickshell ipc call appLauncher_eDP-1 toggleAppLauncher

# mod + enter = start terminal
bind = $⊞, Return, exec, $terminal
# mod + Q = kill current focused application
bind = $⊞, Q, killactive,
# mod + shift + S = take screenshot of area, MUST HAVE HYPRSHOT INSTALLED!
bind = $⊞ SHIFT, S, exec, hyprshot --mode region --output-folder /tmp
# mod + E = open file manager (I prefer caja).
bind = $⊞, E, exec, $fileManager
# mod + space = toggle focus between windows on current workspace
bind = $⊞, SPACE, exec,  $toggleFocus
# mod + shift + space = Toggle focused window to be floating or tiled.
bind = $⊞ SHIFT, SPACE, togglefloating
# mod + F = toggle focused window to full-screen view.
bind = $⊞, F, fullscreen
# mod + D = toggle application launcher (I prefer wofi).
bind = $⊞, D, exec, $appLauncher
#mod + shift + C = refresh hyprland
bind = $⊞ SHIFT, C, exec, $refresh

# ── Focus Navigation ─────────────────────────────────────────
bind = $⊞, left,  movefocus, l
bind = $⊞, right, movefocus, r
bind = $⊞, up,    movefocus, u
bind = $⊞, down,  movefocus, d

# ── Move Floating Window ───────────────────────
binde = $⊞ CTRL,       left,  moveactive, -100    0
binde = $⊞ CTRL,       right, moveactive,  100    0
binde = $⊞ CTRL,       up,    moveactive,    0 -100
binde = $⊞ CTRL,       down,  moveactive,    0  100
binde = $⊞ CTRL SHIFT, left,  moveactive,  -10    0
binde = $⊞ CTRL SHIFT, right, moveactive,   10    0
binde = $⊞ CTRL SHIFT, up,    moveactive,    0  -10
binde = $⊞ CTRL SHIFT, down,  moveactive,    0   10
bind = $⊞ Control_R, Shift_R, togglesplit

# ── Move Window ───────────────────────────────────────────────
bind = $⊞ SHIFT, left,  swapwindow, l
bind = $⊞ SHIFT, right, swapwindow, r
bind = $⊞ SHIFT, up,    swapwindow, u
bind = $⊞ SHIFT, down,  swapwindow, d

# ── Resize focused Window ───────────────────────────────────────────────────
binde = $⊞ ALT,       right, resizeactive,  100    0
binde = $⊞ ALT,       left,  resizeactive, -100    0
binde = $⊞ ALT,       up,    resizeactive,    0 -100
binde = $⊞ ALT,       down,  resizeactive,    0  100
binde = $⊞ ALT SHIFT, right, resizeactive,   10    0
binde = $⊞ ALT SHIFT, left,  resizeactive,  -10    0
binde = $⊞ ALT SHIFT, up,    resizeactive,    0  -10
binde = $⊞ ALT SHIFT, down,  resizeactive,    0   10

# Switch current workspaces with ⊞ + [0-9]
bind = $⊞, 1, workspace, 1
bind = $⊞, 2, workspace, 2
bind = $⊞, 3, workspace, 3
bind = $⊞, 4, workspace, 4
bind = $⊞, 5, workspace, 5
bind = $⊞, 6, workspace, 6
bind = $⊞, 7, workspace, 7
bind = $⊞, 8, workspace, 8
bind = $⊞, 9, workspace, 9
bind = $⊞, 0, workspace, 10

# Move a focused window to a workspace with ⊞ + SHIFT + [0-9]
bind = $⊞ SHIFT, 1, movetoworkspace, 1
bind = $⊞ SHIFT, 2, movetoworkspace, 2
bind = $⊞ SHIFT, 3, movetoworkspace, 3
bind = $⊞ SHIFT, 4, movetoworkspace, 4
bind = $⊞ SHIFT, 5, movetoworkspace, 5
bind = $⊞ SHIFT, 6, movetoworkspace, 6
bind = $⊞ SHIFT, 7, movetoworkspace, 7
bind = $⊞ SHIFT, 8, movetoworkspace, 8
bind = $⊞ SHIFT, 9, movetoworkspace, 9
bind = $⊞ SHIFT, 0, movetoworkspace, 10

# ── Mouse ─────────────────────────────────────────────────────
bindm = $⊞, mouse:272, movewindow
bindm = $⊞, mouse:273, resizewindow
bind  = $⊞, mouse_down, workspace, e-1
bind  = $⊞, mouse_up,   workspace, e+1

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


# Application specific binds
bind = $⊞, Y, exec, firefox https://youtube.com
